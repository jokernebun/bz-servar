<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Customs - Tuning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="tuning-header">
      <div class="tuning-logo-icon">&#9881;</div>
      <h1 class="tuning-title">APEX <span>CUSTOMS</span></h1>
    </div>

    <aside id="leftPanel" class="glass-card">
      <div class="panel-head">
        <h2 class="panel-title">Tuning <span class="accent">Parts</span></h2>
      </div>
      <div id="leftList" class="panel-list"></div>
    </aside>

    <aside id="rightPanel" class="glass-card">
      <div class="panel-head">
        <h2 id="rightTitle" class="panel-title">Select a <span class="accent">Part</span></h2>
        <div id="rightSubTabs" class="panel-subtabs"></div>
      </div>
      <div id="rightList" class="panel-list"></div>
      <div class="panel-footer">
        <div class="panel-footer-row">
          <p class="panel-footer-label">Total</p>
          <p id="totalPrice" class="panel-footer-total">$ 0</p>
        </div>
        <button type="button" id="buyBtn" class="btn-install">Install Upgrades</button>
      </div>
    </aside>

    <div class="bottom-bar">
      <div id="bottomPerf" class="bottom-perf custom-scroll"></div>
      <div class="bottom-sep"></div>
      <div class="bottom-stats">
        <div class="info-block">
          <span class="info-label">HP</span>
          <span id="vehicleHp" class="info-value accent">—</span>
        </div>
        <div class="info-block">
          <span class="info-label">km/h</span>
          <span id="vehicleSpeed" class="info-value accent">—</span>
        </div>
        <div class="info-block">
          <span class="info-label">Clasă impozit</span>
          <span id="taxClass" class="info-value">1</span>
        </div>
      </div>
      <div class="bottom-sep"></div>
      <div class="bottom-info-area">
        <div class="info-block">
          <span class="info-label">Vehicul</span>
          <span id="vehicleName" class="info-value">—</span>
        </div>
        <div class="info-block">
          <span class="info-label">Cash</span>
          <span id="playerCash" class="info-value green">$ 0</span>
        </div>
        <div class="info-block">
          <span class="info-label">Bancă</span>
          <span id="playerCard" class="info-value green">$ 0</span>
        </div>
        <button type="button" id="closeBtn" class="close-btn" aria-label="Close">&#10005;</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
