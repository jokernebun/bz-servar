## ============================================================
##  BZ Framework - Server Configuration
##  Editeaza valorile marcate cu <SCHIMBA>
## ============================================================

# Endpoint
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Server info
sv_maxclients 64
sv_licenseKey "<SCHIMBA_CU_LICENTA_CFXRE>"
sv_hostname "^1BZ^7 RolePlay | ^2Romania"
sets sv_projectName "BZ RolePlay"
sets sv_projectDesc "Server FiveM Romanesc cu joburi, crafting si mai mult!"
sets tags "roleplay, romania, ro, bz"
sets locale "ro-RO"

# Build GTA
set sv_enforceGameBuild 3258

# Steam API (optional)
set steam_webApiKey "none"

# ============================================================
# BAZA DE DATE - SCHIMBA PAROLA!
# ============================================================
set mysql_connection_string "mysql://root:<PAROLA_MYSQL>@localhost/bz_server?charset=utf8mb4"
set mysql_slow_query_warning 200
set mysql_debug false

# ============================================================
# BZ FRAMEWORK CONFIG
# ============================================================
set bz:spawnPoint "hotel"
set bz:startCash 5000
set bz:startBank 10000
set bz:maxCharacters 3
set bz:enableWhitelist false
set bz:devMode false

# ============================================================
# VOICE CHAT
# ============================================================
setr voice_enableUi 1
setr voice_enableProximityCycle 1
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1

# ============================================================
# PERMISIUNI ACE
# ============================================================
add_ace group.admin command allow
add_ace group.admin command.quit allow
add_ace group.admin command.kick allow
add_ace group.admin command.ban allow
add_ace group.admin command.noclip allow
add_ace group.admin command.god allow
add_ace group.admin command.tp allow
add_ace group.admin command.bring allow
add_ace group.admin command.freeze allow
add_ace group.admin command.revive allow
add_ace group.admin command.setjob allow
add_ace group.admin command.setmoney allow
add_ace group.admin command.giveitem allow
add_ace group.superadmin command allow
add_ace group.superadmin group.admin inherit

# Adauga adminii tai (schimba identifier-ele)
# add_principal identifier.license:<LICENTA_ADMIN> group.admin
# add_principal identifier.license:<LICENTA_SUPERADMIN> group.superadmin

# ============================================================
# ORDINEA RESURSELOR (IMPORTANT - nu schimba!)
# ============================================================

